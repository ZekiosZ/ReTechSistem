spring:
  application:
    name: retech-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:rm566198}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 10000
  jackson:
    time-zone: America/Sao_Paulo
server:
  address: 0.0.0.0
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
